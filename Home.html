<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Home – TravelApp</title>
    <style>
        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: system-ui, sans-serif;
            color: #0b2d6b;
            background: linear-gradient(#e6eefb, #f7faff) fixed
        }

        header {
            position: sticky;
            top: 0;
            background: #fff;
            border-bottom: 1px solid #d5e0f5;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 8px 16px;
            align-items: center
        }

        .logo {
            font-weight: 800;
            margin-right: auto
        }

        header a {
            color: #0b2d6b;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: .9rem
        }

        header a.on {
            background: #f26a1b;
            color: #fff;
            font-weight: 700
        }

        main {
            max-width: 960px;
            margin: auto;
            padding: 20px 16px 50px
        }

        h1 {
            text-align: center;
            margin: 8px 0 4px
        }

        h2 {
            margin: 26px 0 8px;
            font-size: 1.2rem
        }

        .sub {
            text-align: center;
            color: #4d638f
        }

        .home {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px
        }

        .card {
            background: #fff;
            border: 1px solid #d5e0f5;
            border-radius: 14px;
            padding: 14px;
            color: inherit;
            text-decoration: none;
            box-shadow: 0 2px 8px #0b2d6b14
        }

        .big {
            font-size: 2.4rem
        }

        .row {
            display: flex;
            gap: 12px;
            align-items: center
        }

        input,
        select,
        button {
            font: inherit;
            padding: 10px;
            border: 1px solid #d5e0f5;
            border-radius: 10px;
            background: #fff;
            color: inherit
        }

        .btn {
            background: #f26a1b;
            color: #fff;
            border: 0;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none
        }

        form {
            display: flex;
            gap: 8px;
            max-width: 600px;
            margin: 16px auto
        }

        form input {
            flex: 1
        }
    </style>
</head>

<body>
    <header>
        <span class="logo">TravelApp</span>
        <a class="on" href="Home.html">Home</a>
        <a href="Explore.html">Explore</a>
        <a href="plan.html">Plan Trip</a>
        <a href="hotels.html">Hotel Booking</a>
        <a href="food.html">Food</a>
        <a href="more.html">More</a>
    </header>
    <main>
        <h1>Welcome to TravelApp</h1>
        <p class="sub">Your journey across India starts here</p>
        <form action="explore.html">
            <input name="q" placeholder="Search destinations, activities, hotels…">
            <button class="btn">Search</button>
        </form>
        <div class="home">
            <a class="card row" href="explore.html">
                <span class="big">🏔️</span>
                <b>Explore Attractions</b></a>
            <a class="card row" href="plan.html">
                <span class="big">🗓️</span>
                <b>Plan Your Trip</b></a>
            <a class="card row" href="hotels.html">
                <span class="big">🏨</span>
                <b>Find Hotels</b></a>
            <a class="card row" href="food.html">
                <span class="big">🍜</span>
                <b>Local Cuisine</b></a>
        </div>
        <h2>Popular Destinations</h2>
        <div class="home">
            <a class="card" href="explore.html?q=delhi">
                <span class="big">🏛️</span><br><b>New Delhi</b></a>
            <a class="card" href="explore.html?q=kathmandu">
                <span class="big">🛕</span><br><b>Kathmandu</b></a>
            <a class="card" href="explore.html?q=goa">
                <span class="big">🏖️</span><br><b>Goa</b></a>
        </div>
        <p style="text-align:right">
            <a href="explore.html">View More →</a>
        </p>
    </main>
</body>

</html>
